# Lab-realistic v2 policy. Generator (scripts/generate.py) consumes
# this file to materialize the hostlist and per-host Dockerfiles.
#
# Total host count: 50. The mix is intentionally NOT uniform across
# distros -- a realistic enterprise fleet skews toward two or three
# primary distros, with a long tail of legacy and special cases.
#
# Drift parameters: every host gets a `provisioned_at` drawn from
# a per-role distribution (older roles like db_primary tend to be
# older; web-edge skews newer because edges are easier to
# rebuild).

seed: 42

# Distro mix as a probability distribution; generator samples with
# the seed above. Roles with a `distros:` field override this.
distro_mix_default:
  ubuntu2204: 0.34
  debian12:   0.22
  rhel9:      0.18
  amzn2023:   0.18
  alpine320:  0.08

# Provisioning age distribution (days before "now"). Roles can
# override with their own `provisioned_at:` block.
provisioned_at_default:
  min_days_ago: 30
  max_days_ago: 1095     # 3 years
  median_days_ago: 540

# 11 roles + 1 legacy special = 47 + 1 + 2 specials = 50 hosts.
roles:

  - id: web-edge
    count: 4
    distros: { ubuntu2204: 0.5, debian12: 0.25, amzn2023: 0.25 }
    tags:
      role: web-edge
      tier: edge
    env_mix: { prod: 0.5, staging: 0.25, canary: 0.25 }

  - id: web-app
    count: 5
    distros: { ubuntu2204: 0.4, debian12: 0.2, rhel9: 0.2, amzn2023: 0.2 }
    tags:
      role: web-app
      tier: app
    env_mix: { prod: 0.6, staging: 0.2, dev: 0.2 }
    runtime_mix: { php: 0.6, node: 0.4 }

  - id: db-primary
    count: 3
    distros: { rhel9: 0.4, ubuntu2204: 0.4, debian12: 0.2 }
    tags:
      role: db-primary
      tier: data
    env_mix: { prod: 0.66, staging: 0.34 }
    engine_mix: { pg: 0.66, mysql: 0.34 }

  - id: db-replica
    count: 4
    distros: { rhel9: 0.25, ubuntu2204: 0.5, debian12: 0.25 }
    tags:
      role: db-replica
      tier: data
    env_mix: { prod: 0.75, staging: 0.25 }
    engine_mix: { pg: 0.75, mysql: 0.25 }

  - id: cache
    count: 3
    distros: { ubuntu2204: 0.66, rhel9: 0.34 }
    tags:
      role: cache
      tier: data
    engine_mix: { redis: 0.66, memcached: 0.34 }

  - id: mq
    count: 2
    distros: { debian12: 0.5, rhel9: 0.5 }
    tags:
      role: mq
      tier: data
    engine_mix: { rabbitmq: 0.5, kafka: 0.5 }

  - id: build-ci
    count: 5
    distros: { ubuntu2204: 0.6, debian12: 0.2, amzn2023: 0.2 }
    tags:
      role: build-ci
      tier: build
      env: ci
    runtime_mix: { jenkins: 0.4, gitlab-runner: 0.6 }
    provisioned_at:
      min_days_ago: 60
      max_days_ago: 730
      median_days_ago: 365

  - id: k8s-cp
    count: 3
    distros: { ubuntu2204: 0.66, rhel9: 0.34 }
    tags:
      role: k8s-cp
      tier: cp
    env_mix: { prod: 0.66, staging: 0.34 }

  - id: k8s-node
    count: 5
    distros: { ubuntu2204: 0.6, rhel9: 0.2, amzn2023: 0.2 }
    tags:
      role: k8s-node
      tier: worker
    env_mix: { prod: 0.6, staging: 0.4 }

  - id: monitoring
    count: 3
    distros: { ubuntu2204: 0.66, debian12: 0.34 }
    tags:
      role: monitoring
      tier: observability
      env: ops

  - id: bastion
    count: 3
    distros: { rhel9: 0.66, ubuntu2204: 0.34 }
    tags:
      role: bastion
      tier: access
    env_mix: { prod: 0.66, corp: 0.34 }

  - id: dev-workstation
    count: 4
    distros: { ubuntu2204: 0.75, debian12: 0.25 }
    tags:
      role: dev-workstation
      tier: internal
      env: corp
    team_mix: { data: 0.25, ops: 0.25, sre: 0.25, backend: 0.25 }
    provisioned_at:
      min_days_ago: 30
      max_days_ago: 730
      median_days_ago: 200

  - id: legacy
    count: 2
    distros: { amzn2: 1.0 }     # special legacy distro
    tags:
      role: legacy
      tier: data
      env: prod
    provisioned_at:
      min_days_ago: 1460
      max_days_ago: 2190
      median_days_ago: 1825   # ~5 years old

# Datacenter assignment is independent of role; uniform random
# from this list. Generator stamps host_meta.tags accordingly.
datacenters:
  - lhr-01
  - fra-02
  - dub-03
  - ams-01

# Vendor non-package binaries available for role-level inclusion.
# Roles reference these by id; generator drops them under
# /opt/<vendor>/ with realistic mtimes.
vendor_packages:
  - id: datadog-agent
    path: /opt/datadog-agent
    binaries: [datadog-agent, datadog-agent-cli]
    used_by: [monitoring, bastion, db-primary]

  - id: splunkforwarder
    path: /opt/splunkforwarder
    binaries: [splunkd]
    used_by: [bastion]

  - id: vector
    path: /opt/vector
    binaries: [vector]
    used_by: [web-edge]   # 50% mix with filebeat handled in role template
