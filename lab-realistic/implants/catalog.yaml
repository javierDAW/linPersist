      linker search path (T1574.006). Non-destructive: a missing search
      dir is silently ignored by ld.so (unlike ld.so.preload, which errors
      on every binary and destabilised the lab host). Caught as a fleet
      singleton.
    expected_signals: [recent_mtime_7d]
    expected_caught_by: [Q1, Q2]
    expected_q7_rule: null
    template: ldso-confd-hijack.tmpl
    vars:
