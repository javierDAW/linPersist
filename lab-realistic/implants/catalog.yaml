  # ====================== v0.4.0 additions =====================
  # Three new MITRE techniques the v0.4.0 sprint covers: T1546.005
  # trap (profile module extension), T1548.001 suid/sgid (new
  # suidbits module), and T1098.007 privileged group membership
  # (passwd module extension).

  - id: trap-bashrc-payload
    tier: L2
    variant: armed
    module: profile
    site_class: profile.trap.system
    description: |
      profile.d drop installing a `trap CMD EXIT` handler bound to
      an inert payload under /tmp. T1546.005.
    expected_signals: [trap_command, trap_exit_handler, trap_command_in_tmp, recent_mtime_7d]
    expected_caught_by: [Q1, Q7]
    expected_q7_rule: payload_under_tmp_via_persistence
    template: trap-bashrc-payload.tmpl
    vars:
      profile_file: /etc/profile.d/zz-trap-cleanup.sh
      payload_path: /tmp/.trap/cleanup

  - id: suid-rooted-binary
    tier: L1
    variant: armed
    module: suidbits
    site_class: suid.user
    description: |
      cp /bin/sh /tmp/.x; chown root; chmod 4755 — textbook T1548.001
      escalation pivot. Surfaces via suid_bit_set + non_package_path.
    expected_signals: [suid_bit_set, non_package_path, recent_mtime_7d]
    expected_caught_by: [Q1, Q7]
    expected_q7_rule: suid_binary_outside_package_path
    template: suid-rooted-binary.tmpl
