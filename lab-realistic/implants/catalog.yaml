  # ================= evasion implants (anti-detection) =================
  # Built to probe linpersist's real limits: what does a defender-aware
  # attacker get away with? Scored honestly -- a MISS here is a finding.

  - id: evade-timestomp
    tier: L4
    variant: orphan
    module: cron
    site_class: cron.d
    description: |
      cron.d directive with mtime back-dated via touch -d to defeat
      recent_mtime_*. ctime stays current, so the v1.0 central
      recent_ctime_7d signal fires while recent_mtime_* does NOT.
      VALIDATED on the nspawn lab (round 20 Debian / round 21 Rocky):
      recent_ctime_7d fires on both dpkg and rpm; the dropped payload
      makes it a Q7 catch via payload_under_tmp_via_persistence (orphan +
      tmp) and an LFA singleton. NOTE: the dedicated timestomp rule is
      tamper-gated (package_file_tampered) to avoid the image-extraction
      FP flood, so it does NOT fire on this pristine-content dropped file
      -- that is by design; this implant's job is to confirm the
      recent_ctime_7d SIGNAL, which it does on both distros.
    expected_signals: [interpreter_in_tmp, exec_target_orphan, recent_ctime_7d]
    expected_caught_by: [Q1, Q2, Q4, Q7, Q9]
    expected_q7_rule: payload_under_tmp_via_persistence
    template: evade-timestomp.tmpl
    vars:
      cron_file: /etc/cron.d/zz-archive-sync
      schedule: "*/9 * * * *"
      payload: /tmp/.ts/agent
      fake_date: "2023-02-01 03:14:00"

  - id: evade-pkg-tamper
    tier: L4
    variant: armed
    module: cron
    site_class: cron.d
    description: |
      Appends a malicious line to the PACKAGE-OWNED /etc/crontab running a
      packaged LOLBin (/usr/bin/bash) -- no non_package/orphan/tmp signal.
      Pre-v1.0 this was caught ONLY by the LFA singleton. v1.0 adds dpkg
      integrity verification: /etc/crontab is a registered conffile, so its
      recorded hash lives in the Conffiles: stanza of /var/lib/dpkg/status;
      the appended line makes the file mismatch -> package_file_tampered ->
      package_owned_file_tampered rule. Integrity verification covers
      dpkg (md5sums + Conffiles), rpm (FILEDIGESTS) AND apk (Z:), so this
      is caught on all three families; the only remaining evasion is
      fleet-wide spread, which the LFA singleton still defeats.
      VALIDATED on the nspawn lab: round 20 (Debian) emits
      package_file_tampered on /etc/crontab + the Q7 rule, zero tamper FPs
