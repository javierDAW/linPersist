# linpersist detections — source of truth for cross-cutting implant clauses.
#
# Consumers:
#   - cmd/linpersist-report   — Go-native matcher loaded via go:embed.
#                                Drives Q7 "Implant roll-call" rows.
#   - cmd/detgen              — regenerates the Q7 WHERE block in
#                                tools/stack_demo.sql. Verify mode is
#                                wired as a release gate (see Makefile).
#
# Both consumers MUST stay in sync. The release gate diffs the
# regenerated SQL against what is committed and fails the build on
# drift. See ADR-0013 for the schema rationale.
#
# Predicates (positive predicates AND-joined within a single `when:`;
# signals_none short-circuits the whole `when:`):
#
#   signals_all:          [a, b, ...]   every signal in the list must be present
#   signals_any:          [a, b, ...]   at least one signal in the list must be present
#   signals_none:         [a, b, ...]   no signal in the list may be present (FP suppression)
#   module_in:            [a, b, ...]   record.module must be one of these
#   site_class_in:        [a, b, ...]   record.site_class must be one of these
#   content_contains_any: ["a", "b"]    record.content_snippet must contain at least one substring
#
# Calibration note (v0.2.x-tune): the curl/wget and /tmp content
# patterns below are the v0.2.x-tune refinements. The older form (raw
# "curl", "wget", "/tmp/") flooded fleets with dotfile installers and
# lock-file mktemp(1) FPs. The current patterns require piped-to-shell
# forms or implant-style dot-prefixed tmp paths.

schema_version: 1

detections:

  # ---------- High-precision exec_target patterns -------------------

  - id: payload_under_tmp_via_persistence
    description: Persistence record points at a tmp-class payload that does not exist on disk
    severity: high
    mitre: [T1053.003, T1574.006, T1556.003, T1543.002, T1546]
    when:
      signals_all: [exec_target_orphan, interpreter_in_tmp]

  - id: trap_handler_payload_in_tmp
    description: Shell trap handler executes a tmp-class payload — a trap (EXIT/DEBUG/signal) whose command resolves under /tmp, /var/tmp, /dev/shm or /run/shm runs the dropped binary on every shell exit; legitimate traps never target tmp
    severity: high
    mitre: [T1546.005]
    when:
      signals_all: [trap_command_in_tmp]

  - id: pam_module_in_tmp
    description: PAM stack loads a module from a tmp-class directory (Volexity/DFIR Report pattern)
    severity: critical
    mitre: [T1556.003]
    when:
      module_in: [pam]
      signals_all: [interpreter_in_tmp]

  # ---------- Identity / privilege backdoors -----------------------

  - id: second_uid_zero_account
    description: passwd.user entry has uid 0 with username != root
    severity: critical
    mitre: [T1136.001]
    when:
      signals_any: [passwd_uid_zero]

  - id: sudoers_nopasswd_all_backdoor
    description: Sudoers entry grants NOPASSWD on the ALL command list (expect CI service-account FPs until role tags ship)
    severity: critical
    mitre: [T1548.003]
    when:
      signals_all: [sudoers_nopasswd, sudoers_all_commands]

  # ---------- Kernel / bootloader vectors --------------------------

  - id: kmod_install_directive_implant
    description: modprobe install directive replaces module load with a payload outside the package universe
    severity: high
    mitre: [T1547.006]
    when:
      signals_all: [kmod_install_directive]
      signals_any: [interpreter_in_tmp, exec_target_orphan, non_package_path, shell_indirect]

  - id: grub_init_override
    description: GRUB cmdline carries an init= override that replaces pid-1 at next boot
    severity: critical
    mitre: [T1542.003]
    when:
      signals_any: [grub_cmdline_init]

  # ---------- Systemd structural anomalies -------------------------

  - id: systemd_external_unit_symlink_implant
    description: systemd .wants/.requires symlink points outside the walked unit loci
    severity: high
    mitre: [T1543.002]
    when:
      signals_any: [systemd_external_unit_symlink]

  # ---------- Shell-init / motd remote-fetch (calibrated patterns) -

  - id: shell_init_remote_fetch
    description: System or user shell-init pipes a curl/wget download into a shell interpreter (curl|sh implant pattern)
    severity: high
    mitre: [T1546.004]
    when:
      module_in: [profile]
      content_contains_any:
        - "| sh"
        - "| bash"
        - "|sh "
        - "|bash "
        - "curl | "
        - "wget | "

  - id: motd_remote_fetch
    description: motd or update-motd.d script pipes a curl/wget download into a shell interpreter
    severity: high
    mitre: [T1037]
    when:
      module_in: [motd]
      content_contains_any:
        - "| sh"
        - "| bash"
        - "|sh "
        - "|bash "
        - "curl | "
        - "wget | "

  # ---------- Sysv with implant-style /tmp body usage --------------

  - id: sysv_init_tmp_reference
    description: sysv.init script body launches a binary from a tmp-class path (implant-style dot-dir or exec /tmp pattern)
    severity: high
    mitre: [T1037.004]
    when:
      module_in: [sysv]
      content_contains_any:
        - ". /tmp/"
        - "exec /tmp/"
        - "bash /tmp/"
        - "sh /tmp/"
        - "/tmp/."

  # ---------- v0.3.0-coverage: detections for orphan-but-emitted signals
  #
  # The agent already emits these signals via existing modules; the
  # rules below promote them from "visible in Q5" to "actionable in
  # Q7 with severity and detection id". No new code required; only
  # detection-time correlation with FP-suppression negatives.

  - id: ld_preload_set_with_non_package
    description: /etc/ld.so.preload references a library outside the package universe (textbook LD_PRELOAD injection)
    severity: critical
    mitre: [T1574.006]
    when:
      signals_all: [ld_preload_set, non_package_path]

  - id: ld_preload_target_tampered
    description: /etc/ld.so.preload references a package-owned library whose on-disk content no longer matches the package-recorded digest — the in-place .so overwrite an orphan-path check misses (Symbiote/HiddenWasp shape). The preloaded library is integrity-checked directly, not just the preload config locus. Residual FP class —a library legitimately recompiled/patched in place, rare and itself worth surfacing
    severity: critical
    mitre: [T1574.006, T1554]
    when:
      signals_all: [ld_preload_set, package_file_tampered]

  - id: ld_library_shadow_implant
    description: an /etc/ld.so.conf.d (or ld.so.conf) search-path directive adds a non-standard directory containing a shared object whose basename collides with a package-owned system library — the dynamic linker resolves the SONAME to the planted copy first, hijacking every process that loads it (T1574.006 library shadowing via ld.so.conf.d). Fires only on the package-shadowing collision; bare path-injection with no collision is LFA-only. Residual FP class —a locally source-built library legitimately shadowing the distro one, rare and itself worth review
    severity: critical
    mitre: [T1574.006]
    when:
      signals_all: [ld_library_shadows_packaged]

  - id: polkit_admin_rule_implant
    description: polkit rule contains addAdminRule( and was recently modified (recent_mtime_7d) or is non-root-owned. NOTE recent_ctime_7d was trialled here to close the touch -d timestomp bypass but the nspawn lab showed it fires on the image-extracted stock vendor rules under /usr/share/polkit-1 on every freshly-provisioned host — so the touch -d bypass is left to LFA singleton stacking (the attacker drop-in is a content singleton; vendor rules are fleet-common)
    severity: high
    mitre: [T1548]
    when:
      signals_all: [polkit_admin_rule]
      signals_any: [recent_mtime_7d, non_root_owner]

  - id: polkit_yes_constant_implant
    description: polkit rule grants polkit.Result.YES unconditionally and was recently modified (recent_mtime_7d) or is non-root-owned. recent_ctime_7d is deliberately NOT in the gate — it floods on image-extracted stock vendor YES rules (lab-confirmed); the touch -d timestomp bypass is caught by LFA singleton stacking instead
    severity: high
    mitre: [T1548]
    when:
      signals_all: [polkit_yes_constant]
      signals_any: [recent_mtime_7d, non_root_owner]

  - id: sshd_root_login_enabled
    description: sshd_config explicitly enables PermitRootLogin yes (rare on hardened fleets; high on a hosts-where-most-have-no flag)
    severity: high
    mitre: [T1098.004, T1556]
    when:
      signals_any: [sshd_permit_root_login_yes]

  - id: sshd_authorized_keys_command_external
    description: sshd_config AuthorizedKeysCommand points at an external binary not provided by any installed package
    severity: critical
    mitre: [T1098.004]
    when:
      signals_all: [sshd_authorized_keys_command]
      signals_any: [non_package_path, exec_target_orphan, interpreter_in_tmp]

  - id: udev_run_with_non_package
    description: udev rule RUN+= directive launches a binary outside the package universe
    severity: high
    mitre: [T1546]
    when:
      signals_all: [udev_run_directive]
      signals_any: [non_package_path, exec_target_orphan, interpreter_in_tmp]

  - id: kmod_autoload_unpackaged_module
    description: a kernel module scheduled to auto-load at boot (/etc/modules, modules-load.d, or a modprobe options/softdep directive) resolves to a .ko outside the package universe — the planted-LKM rootkit shape (Diamorphine/Reptile) where the autoload config points at a module no package shipped. Gated on non_package_path so the host's packaged autoloaded modules stay silent
    severity: critical
    mitre: [T1547.006]
    when:
      module_in: [kmod]
      signals_all: [kmod_autoload, non_package_path]

  - id: sshd_login_env_injection
    description: sshd is configured to let a client inject a code-exec environment variable on login — PermitUserEnvironment yes (so ~/.ssh/environment can set BASH_ENV/LD_PRELOAD) or a SetEnv/AcceptEnv naming BASH_ENV/ENV/LD_PRELOAD/LD_LIBRARY_PATH/LD_AUDIT. Low legitimate prevalence; turns a key into code execution every login
    severity: high
    mitre: [T1556, T1574.006]
    when:
      module_in: [sshd]
      signals_any: [sshd_permit_user_environment, sshd_env_injection]

  - id: ssh_sshrc_unmanaged_exec
    description: an /etc/ssh/sshrc or ~/.ssh/rc per-session hook sources/execs a target outside the package universe (orphan, tmp-class, or non-package) — runs on every ssh login. Existence alone is signal+LFA (legit admin use); this fires only with the unmanaged-exec co-indicator
    severity: high
    mitre: [T1546.004]
    when:
      signals_all: [sshrc_present]
      signals_any: [non_package_path, exec_target_orphan, interpreter_in_tmp]

  - id: profile_env_hook_unmanaged
    description: a shell-init file (most dangerously /etc/environment, read by pam_env on EVERY login) assigns BASH_ENV= or ENV= to a target outside the package universe (orphan, tmp-class, or non-package) — bash sources $BASH_ENV at the start of every non-interactive shell and POSIX sh sources $ENV, so the named file runs on every cron job / script / login. Existence alone is signal+LFA (rare legit dev use); this fires only with the unmanaged-exec co-indicator
    severity: high
    mitre: [T1546.004]
    when:
      signals_all: [env_hook_set]
      signals_any: [non_package_path, exec_target_orphan, interpreter_in_tmp]

  - id: python_runtime_hook_unmanaged
    description: a Python interpreter startup hook (sitecustomize.py / usercustomize.py, or a *.pth with an `import` code line) on a site/dist-packages dir is outside the package universe, or a package-owned one was overwritten in place — CPython auto-executes it in every interpreter invocation (every script / cron / `python3 -c`). Shipped hooks (a packaged sitecustomize.py, distutils-precedence.pth) resolve owned and stay silent; this fires only on the non-package/tamper co-indicator
    severity: high
    mitre: [T1546]
    when:
      module_in: [runtimeinit]
      signals_any: [non_package_path, package_file_tampered]

  - id: php_autoprepend_unmanaged
    description: php.ini auto_prepend_file / auto_append_file names a PHP script outside the package universe that the engine runs before/after EVERY request (web + CLI). Owned vendor prepend scripts stay silent; this fires only on the non-package/orphan co-indicator
    severity: high
    mitre: [T1546]
    when:
      site_class_in: [php.ini]
      signals_any: [non_package_path, exec_target_orphan, interpreter_in_tmp]

  - id: initramfs_hook_unmanaged
    description: an early-boot initramfs/initrd hook (initramfs-tools, dracut or mkinitcpio) is either outside the package universe (a planted hook — empty /etc hook dirs make any local file an admin/attacker addition) or a package-owned hook overwritten in place (package_file_tampered — the Bootkit-style initrd hook an orphan-path check misses). The generator copies the hook into the initrd and runs it AS ROOT before the real rootfs mounts. Packaged hooks stack fleet-identically and stay silent; this fires only with the unmanaged/tampered co-indicator
    severity: high
    mitre: [T1542]
    when:
      module_in: [initramfs]
      signals_any: [non_package_path, package_file_tampered]

  # ---------- duel-3: config-embedded exec edges (confexec) -----------
  # Each fires only when the config's lifted exec edge points at a
  # non-package/orphan/tmp target. A confexec record exists only when an
  # exec edge was found, so clean configs never reach these rules; the
  # large legitimate populations (mailman pipes, needrestart apt hooks,
  # systemctl postrotate, packaged libnss_sss, stock sudoers.so) resolve
  # owned and stay signal-only. Residual FP class per rule: a site-local
  # /usr/local or /opt admin hook, discriminated by LFA singleton stacking.

  - id: mail_alias_pipe_unmanaged
    description: an /etc/aliases or ~/.forward pipe alias runs a command outside the package universe AS root on every mail delivery to that alias (the classic |program mail backdoor). Packaged pipes (mailman/vacation) resolve owned and stay silent; this fires only on the non-package/orphan co-indicator
    severity: high
    mitre: [T1546.004]
    when:
      site_class_in: [mail.aliases]
      signals_any: [non_package_path, exec_target_orphan, interpreter_in_tmp]

  - id: incron_exec_unmanaged
    description: an incron (inotify-cron) entry runs a command outside the package universe when a watched path fires a filesystem event — an event-driven cron the time-based cron parser misses. Gated on the non-package/orphan co-indicator
    severity: high
    mitre: [T1053.003]
    when:
      site_class_in: [incron.d]
      signals_any: [non_package_path, exec_target_orphan, interpreter_in_tmp]

  - id: logrotate_script_unmanaged
    description: a logrotate prerotate/postrotate/firstaction script block runs a command outside the package universe AS root on rotation (daily from cron). Ubiquitous owned-binary postrotate (systemctl/killall/invoke-rc.d) stays silent; this fires only on a parked non-package/orphan hook
    severity: high
    mitre: [T1546]
    when:
      site_class_in: [logrotate.d]
      signals_any: [non_package_path, exec_target_orphan, interpreter_in_tmp]

  - id: pkgmgr_hook_unmanaged
    description: a package-manager hook (APT DPkg::Pre/Post-Invoke, dnf/yum post-transaction action) runs a command outside the package universe AS root on every package operation — config-as-persistence on the package manager itself. The large legitimate hook population (apt-listchanges/needrestart/debsums) is packaged and stays silent; this fires only on the non-package/orphan co-indicator
    severity: high
    mitre: [T1546.016]
    when:
      site_class_in: [pkgmgr.hook]
      signals_any: [non_package_path, exec_target_orphan, interpreter_in_tmp]

  - id: sudo_plugin_unmanaged
    description: an /etc/sudo.conf Plugin directive loads a shared object outside the package universe into setuid-root sudo on every invocation. The stock sudoers.so resolves owned and stays silent; this fires only on an unowned/orphan plugin .so
    severity: critical
    mitre: [T1574]
    when:
      site_class_in: [sudo.conf.plugin]
      signals_any: [non_package_path, exec_target_orphan]

  - id: nss_module_unmanaged
    description: an /etc/nsswitch.conf service token outside the curated glibc vendor allowlist resolves to a libnss_<token>.so.2 outside the package universe — glibc dlopens it into every process doing name lookups (Symbiote-class NSS hijack). Packaged third-party modules (libnss_sss/ldap/winbind) are allowlisted and resolve owned; this fires only on an unowned planted module
    severity: critical
    mitre: [T1556]
    when:
      site_class_in: [nss.nsswitch]
      signals_any: [non_package_path, exec_target_orphan]

  - id: environment_d_hook_unmanaged
    description: a systemd environment.d assignment (LD_PRELOAD/LD_AUDIT/BASH_ENV/ENV) names a code-exec target outside the package universe, loaded/sourced into every user session — a third env-delivery surface beyond /etc/environment and ld.so.preload. Owned vendor paths stay silent; this fires only on the non-package/orphan co-indicator
    severity: high
    mitre: [T1574.006]
    when:
      site_class_in: [environment.d]
      signals_any: [non_package_path, exec_target_orphan, interpreter_in_tmp]

  - id: xsession_hook_unmanaged
    description: an X11 session script (/etc/X11/Xsession.d, xinitrc.d, ~/.xprofile) sources/execs a command outside the package universe on every graphical login. Packaged session scripts stay silent; this fires only on the non-package/orphan co-indicator. Surface exists only where a desktop environment is installed
    severity: high
    mitre: [T1037]
    when:
      site_class_in: [xsession.d]
      signals_any: [non_package_path, exec_target_orphan, interpreter_in_tmp]

  - id: file_capability_outside_package
    description: a file carries privileged file capabilities (cap_setuid/setgid/dac_override/sys_admin/...) and is outside the package universe — a setcap privesc/persistence primitive that find -perm -4000 and mode-only scans miss entirely. Gated on non_package_path so the legitimate packaged caps set (ping/cap_net_raw, etc.) stays silent
    severity: critical
    mitre: [T1548.001]
    when:
      signals_all: [file_cap_privileged]
      signals_any: [non_package_path, exec_target_orphan]

  - id: systemd_generator_unmanaged
    description: a systemd generator (executable that runs as root at early boot under */systemd/system-generators) is outside the package universe — a planted generator is enable-free boot persistence the unit walker never saw (Sandworm/AA22). Gated on non_package/orphan so the handful of package-shipped vendor generators stay silent
    severity: critical
    mitre: [T1543.002]
    when:
      module_in: [systemd]
      site_class_in: [systemd.generator]
      signals_any: [non_package_path, exec_target_orphan]

  - id: systemd_aux_exec_unmanaged
    description: systemd ExecStartPre/Post/StopPost/Reload/Condition runs an orphan, package-unowned or tmp-class target — root-context behavior injection that carries no ExecStart= of its own, classically a drop-in into a legitimate vendor unit (Turla). The first-ExecStart-only resolver missed it. Gated on the orphan/non_package/tmp co-indicator, so legitimate packaged ExecStartPre hooks stay silent
    severity: high
    mitre: [T1543.002, T1574]
    when:
      signals_all: [systemd_aux_exec_unmanaged]

  - id: interpreter_executes_unmanaged_script
    description: A packaged script interpreter (python3/perl/bash/...) runs a script-file argument outside the package universe — the "live off the packaged interpreter, park the payload" shape where exec_target is the owned interpreter and the orphan script is otherwise invisible. Residual FP class —config-management (Ansible/Salt) drops legitimate python3 /opt/<co>/maintenance.py cron jobs and units; the durable discriminator is LFA (a parked payload is a fleet content singleton, a managed script is not)
    severity: high
    mitre: [T1059.006, T1543.002]
    when:
      module_in: [cron, systemd]
      signals_all: [interpreter_runs_orphan_script]

  - id: sudoers_nopasswd_shell_escape
    description: NOPASSWD sudo grant on a shell-escape GTFOBin (vi/less/awk/find/python/tar/...) — a single-command rule that is really a password-less root shell (sudo vi -> :!sh), which sudoers_all_commands never matches. Curated set excludes commonly-legit systemctl/service/docker/git. Residual FP class —ops/CI accounts granted NOPASSWD tar/find for backups; LFA singleton stacking discriminates the attacker's fresh-account grant from a fleet-common one
    severity: high
    mitre: [T1548.003]
    when:
      signals_all: [sudoers_nopasswd, sudoers_nopasswd_gtfobin]

  - id: netdispatch_run_unmanaged
    description: NetworkManager dispatcher.d script runs a target outside the package universe — root executes on every network up/down event. The non_package_path/orphan signal already fired on the dropped script; this rule (mirroring udev_run_with_non_package) is what consumes it. Residual FP class —VPN clients and config-management that install dispatcher hooks outside the package manager; LFA singleton stacking discriminates the planted-once script
    severity: high
    mitre: [T1546]
    when:
      module_in: [netdispatch]
      signals_any: [non_package_path, exec_target_orphan, interpreter_in_tmp]

  - id: sysv_external_init_symlink_implant
    description: rcN.d/ symlink resolves outside the init.d/ tree (offensive enable-without-touching-init.d pattern)
    severity: high
    mitre: [T1037.004]
    when:
      signals_any: [sysv_external_init_symlink]

  - id: systemd_install_alias_external_implant
    description: systemd unit [Install] Alias= path resolves outside the walked unit loci
    severity: high
    mitre: [T1543.002]
    when:
      signals_any: [systemd_install_alias_external]

  - id: xdg_autostart_unmanaged
    description: XDG autostart entry launches a binary outside the package universe
    severity: high
    mitre: [T1547.013]
    when:
      module_in: [xdg]
      signals_any: [non_package_path, exec_target_orphan, interpreter_in_tmp]

  - id: passwd_empty_password_account
    description: /etc/shadow lists an account with an empty password field (logs in without authentication)
    severity: critical
    mitre: [T1136.001]
    when:
      signals_any: [passwd_no_password]

  # ---------- v0.3.0-coverage: systemd structural family ------------

  - id: tmpfiles_creates_payload_at_boot
    description: systemd-tmpfiles directive creates an executable under /tmp at boot (payload restoration across reboots)
    severity: critical
    mitre: [T1543.002]
    when:
      signals_any: [tmpfiles_creates_under_tmp]

  - id: sysusers_second_uid_zero
    description: systemd-sysusers declares a uid-0 user with a non-root name (declarative second-root-account implant)
    severity: critical
    mitre: [T1136.001]
    when:
      signals_any: [sysusers_uid_zero]

  - id: systemd_linger_non_root_account
    description: A non-root account has systemd linger enabled (user-mode units survive logout — documented persistence vector)
    severity: high
    mitre: [T1546]
    when:
      signals_any: [systemd_linger_non_root]

  # ---------- v0.4.0: setuid/setgid escalation surface ------------

  - id: suid_binary_outside_package_path
    description: Suid or sgid binary at a path not owned by any installed package (T1548.001 implant shape)
    severity: critical
    mitre: [T1548.001]
    when:
      signals_all: [non_package_path]
      signals_any: [suid_bit_set, sgid_bit_set]

  # ---------- v0.5.0 follow-up: cloud-native surfaces -----------------
  # Three rules covering the dbus / cloudinit / k8sstatic modules
  # added in v0.5.0. Module-scoped (no per-site_class predicate in the
  # schema yet); the residual FP classes are documented per rule.

  - id: dbus_exec_under_tmp
    description: D-Bus service file points at an Exec= path under /tmp — dbus-daemon execs it as root on bus activation
    severity: critical
    mitre: [T1543]
    when:
      module_in: [dbus]
      signals_all: [interpreter_in_tmp]

  - id: cloudinit_script_non_package_path
    description: cloud-init per-boot/per-instance/per-once script at a path not owned by any installed package — cloud-init runs these as root on every boot
    severity: high
    mitre: [T1543, T1547]
    when:
      site_class_in: [cloudinit.script]
      signals_all: [non_package_path]

  - id: k8s_static_pod_unqualified_image
    description: Static pod manifest references a bare image name (no registry, no tag) — legitimate kubelet pods always use full registry refs like registry.k8s.io/kube-apiserver:v1.30.0
    severity: high
    mitre: [T1543.005]
    when:
      module_in: [k8sstatic]
      signals_all: [unqualified_exec_target]

  # ---------- Anti-evasion (defender-aware attacker) ----------------
  # These two rules close the gaps the lab-realistic evade-* implants
  # were built to probe. Both carry a documented residual-FP class and
  # are scored medium accordingly: they are triage prompts, not
  # verdicts, and the durable discriminator stays LFA singleton stacking
  # (the tampered/timestomped content is still a fleet singleton).

  - id: timestomp_recent_ctime_stale_mtime
    description: A package-owned file was modified (package_file_tampered) AND its mtime back-dated to look old (recent_ctime_7d without recent_mtime_*) — the touch -d / utimes anti-forensic combo. Requiring the tamper co-signal makes it immune to the benign fresh-ctime+old-mtime that EVERY image/tarball-provisioned host shows (cloud images, containers, debootstrap, rsync -a, restore-from-backup) since extraction never alters content. The dropped-payload timestomp variant is covered by payload_under_tmp_via_persistence
    severity: high
    mitre: [T1070.006]
    when:
      signals_all: [recent_ctime_7d, package_file_tampered]
      signals_none: [recent_mtime_7d, recent_mtime_30d]

  - id: package_owned_file_tampered
    description: A package-owned file no longer matches the digest its package manager recorded at install (dpkg md5sums/Conffiles, rpm FILEDIGESTS, apk Z:) — catches the append-to-/etc/crontab persistence shape that emits no orphan/tmp/non_package signal. Residual FP class —legitimate admin edits to config files, which dpkg --verify / rpm -V likewise report
    severity: medium
    mitre: [T1554]
    when:
      signals_all: [package_file_tampered]
