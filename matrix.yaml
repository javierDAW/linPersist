# linpersist coverage matrix
#
# Source of truth for MITRE ATT&CK Linux persistence coverage.
# Each entry describes one site_class collected by exactly one module.
#
# status values:
#   planned     -- accepted into the roadmap, not yet implemented
#   wip         -- module exists, golden tests not green
#   implemented -- code complete, golden tests green
#   tested      -- integration tests green on at least two target distros
#
# Adding a new site_class requires: spec discussed, ADR if non-obvious,
# golden tests written first, then implementation. Never the other way
# around.

schema_version: 1
target_release: v0.1.0

site_classes:

  - site_class: cron.d
    module: cron
    mitre: [T1053.003]
    loci:
      - /etc/crontab
      - /etc/cron.d/
    status: wip
    test_coverage: none
    notes: |
      System-wide crontabs with explicit USER column. One record per
      non-comment, non-blank line. Variable assignments (MAILTO=,
      PATH=, SHELL=, RANDOM_DELAY=, ...) emitted as their own records
      with signal cron_var_assignment.

  - site_class: cron.user
    module: cron
    mitre: [T1053.003]
    loci:
      - /var/spool/cron/crontabs/
      - /var/spool/cron/
    status: wip
    test_coverage: none
    notes: |
      Per-user crontabs without USER column; the user name is the file
      name. /var/spool/cron/crontabs/ on Debian/Ubuntu,
      /var/spool/cron/ on RHEL/CentOS/Amazon Linux. One record per
      non-comment, non-blank line.

  - site_class: cron.periodic
    module: cron
    mitre: [T1053.003]
    loci:
      - /etc/cron.hourly/
      - /etc/cron.daily/
      - /etc/cron.weekly/
      - /etc/cron.monthly/
    status: wip
    test_coverage: none
    notes: |
      run-parts drop-in directories. Each executable file is an
      atomic record (granularity = per file, not per line). Symlinks
      are followed for hashing and provenance but locus stays the
      original path.

  - site_class: cron.anacron
    module: cron
    mitre: [T1053.003]
    loci:
      - /etc/anacrontab
    status: wip
    test_coverage: none
    notes: |
      Anacrontab format per anacrontab(5):
      "period delay jobid command". One record per non-comment,
      non-blank line. Variable assignments handled identically to
      cron.d. @period shorthands (@monthly, @yearly, @daily) emitted
      verbatim.

  - site_class: systemd.unit
    module: systemd
    mitre: [T1543.002]
    loci:
      - /etc/systemd/system/
      - /usr/lib/systemd/system/
      - /lib/systemd/system/
      - /run/systemd/system/
      - /etc/systemd/user/
      - ~/.config/systemd/user/
    status: planned
    test_coverage: none
    notes: |
      Normalization canonicalizes section order, key casing per
      systemd.unit(5), strips comments and blank lines. ExecStart and
      ExecStartPre/Post resolved against PATH to populate exec_target.

  - site_class: systemd.timer
    module: systemd
    mitre: [T1053.006]
    loci:
      - /etc/systemd/system/
      - /usr/lib/systemd/system/
      - /lib/systemd/system/
      - /run/systemd/system/
    status: planned
    test_coverage: none
    notes: |
      Emits one record per .timer unit; cross-references the .service it
      activates via Unit= or implicit naming convention.

  - site_class: sysv.init
    module: sysv
    mitre: [T1037.004]
    loci:
      - /etc/init.d/
      - /etc/rc.local
      - /etc/rc0.d/
      - /etc/rc1.d/
      - /etc/rc2.d/
      - /etc/rc3.d/
      - /etc/rc4.d/
      - /etc/rc5.d/
      - /etc/rc6.d/
      - /etc/rcS.d/
    status: planned
    test_coverage: none
    notes: |
      Largely legacy but still present on RHEL 7, Amazon Linux 2 and
      embedded systems. rc*.d entries followed through symlinks to
      /etc/init.d/<service>.

  - site_class: ssh.authkeys
    module: ssh
    mitre: [T1098.004]
    loci:
      - /etc/ssh/authorized_keys
      - /etc/ssh/authorized_keys.d/
      - /root/.ssh/authorized_keys
      - /root/.ssh/authorized_keys2
      - /home/*/.ssh/authorized_keys
      - /home/*/.ssh/authorized_keys2
    status: wip
    test_coverage: none
    notes: |
      One record per non-comment, non-blank key line. Normalization
      canonicalizes the option list order (command=, from=, no-pty,
      environment=, permitopen=, ...) and excludes the trailing
      comment from content_norm_sha256. The base64 public-key blob
      is NEVER emitted: only its sha256 lands in exec_target_sha256.
      exec_target carries the keytype (ssh-ed25519, ssh-rsa, ...).
      See ADR-0003 for the blob-handling decision. New signals
      ssh_options_present and ssh_forced_command added to the core
      catalog for this module.

  - site_class: sshd.config
    module: sshd
    mitre: [T1098.004, T1556]
    loci:
      - /etc/ssh/sshd_config
      - /etc/ssh/sshd_config.d/
    status: wip
    test_coverage: none
    notes: |
      One record per non-comment, non-blank directive line, plus
      one record per Match line. Match block scoping is encoded
      into content_norm_sha256 by prepending the canonical Match
      line to each directive's canonical form (see ADR-0004).
      Directive keywords are lower-cased; values preserved verbatim.
      Three module-specific signals added to core:
      sshd_permit_root_login_yes, sshd_authorized_keys_command,
      sshd_match_block_directive. Lives in its own module (sshd)
      separate from ssh.authkeys because the parsing logic and
      site_class are independent.

  - site_class: pam
    module: pam
    mitre: [T1556.003]
    loci:
      - /etc/pam.d/
      - /etc/pam.conf
    status: planned
    test_coverage: none
    notes: |
      One record per file, one per non-comment line. exec_target is the
      pam module .so path; signals flag non-package paths and modules
      under /tmp, /var/tmp, /dev/shm.

  - site_class: ldso.preload
    module: ldso
    mitre: [T1574.006]
    loci:
      - /etc/ld.so.preload
    status: implemented
    test_coverage: golden
    notes: |
      ld.so.preload is one of the cheapest, highest-signal persistence
      sites. Every non-empty line is a separate record with signals
      including ld_preload_set and exec_target_orphan. Lines containing
      multiple whitespace-separated paths are split: glibc honors that
      form even though ld.so(8) documents one path per line.

  - site_class: ldso.conf
    module: ldso
    mitre: [T1574.006]
    loci:
      - /etc/ld.so.conf
    status: implemented
    test_coverage: golden
    notes: |
      Library search-path configuration. One record per non-comment,
      non-blank line. include directives emitted verbatim as their own
      record; the agent does NOT expand the glob inside the record but
      walks /etc/ld.so.conf.d/ separately under ldso.confd.

  - site_class: ldso.confd
    module: ldso
    mitre: [T1574.006]
    loci:
      - /etc/ld.so.conf.d/
    status: implemented
    test_coverage: golden
    notes: |
      Drop-in directory for ld.so.conf. One record per non-comment,
      non-blank line across every *.conf file under the directory.

  - site_class: sudoers
    module: sudoers
    mitre: [T1548.003]
    loci:
      - /etc/sudoers
      - /etc/sudoers.d/
    status: wip
    test_coverage: none
    notes: |
      One record per non-comment, non-blank line. Five line kinds
      recognized: alias (User_Alias, Runas_Alias, Host_Alias,
      Cmnd_Alias), Defaults, user-spec, #include, #includedir.
      Per-line granularity; multi-user / multi-command user-specs
      are NOT cartesian-expanded in v0.1.0. Members of *_Alias
      records are sorted alphabetically for stacking. Include
      directives emitted verbatim; the walker traverses
      /etc/sudoers.d/* on its own without honoring custom
      #includedir paths. Three module-specific signals added to
      core: sudoers_nopasswd, sudoers_all_commands,
      sudoers_include_directive.

  - site_class: passwd
    module: passwd
    mitre: [T1136.001]
    loci:
      - /etc/passwd
      - /etc/shadow
      - /etc/group
      - /etc/gshadow
    status: planned
    test_coverage: none
    notes: |
      One record per user with uid 0 or shell other than /usr/sbin/nologin
      and /bin/false. /etc/shadow read attempts capture only the locked/
      unlocked state via the first char of the hash field; the hash itself
      is never emitted.

  - site_class: profile.system
    module: profile
    mitre: [T1546.004]
    loci:
      - /etc/profile
      - /etc/profile.d/
      - /etc/bash.bashrc
      - /etc/zsh/zshenv
      - /etc/zsh/zprofile
      - /etc/environment
    status: planned
    test_coverage: none
    notes: |
      System-wide shell init. Normalization strips comments and trailing
      whitespace; preserves declarations and command invocations.

  - site_class: profile.user
    module: profile
    mitre: [T1546.004]
    loci:
      - /root/.bashrc
      - /root/.bash_profile
      - /root/.bash_login
      - /root/.profile
      - /root/.zshrc
      - /root/.zshenv
      - /home/*/.bashrc
      - /home/*/.bash_profile
      - /home/*/.bash_login
      - /home/*/.profile
      - /home/*/.zshrc
      - /home/*/.zshenv
    status: planned
    test_coverage: none
    notes: |
      Per-user shell init. One record per file. Bash login order is
      enforced for stacking comparability.

  - site_class: motd
    module: motd
    mitre: [T1037.004]
    loci:
      - /etc/update-motd.d/
      - /etc/motd
      - /etc/issue.net
      - /etc/issue
    status: planned
    test_coverage: none
    notes: |
      update-motd.d scripts run as root on each login on Debian/Ubuntu;
      classic persistence path. Each script emitted as its own record.

  - site_class: kmod
    module: kmod
    mitre: [T1547.006]
    loci:
      - /etc/modules
      - /etc/modules-load.d/
      - /etc/modprobe.d/
      - /lib/modprobe.d/
      - /usr/lib/modprobe.d/
      - /run/modprobe.d/
    status: planned
    test_coverage: none
    notes: |
      Auto-loaded kernel modules and modprobe options. Out-of-tree
      modules surface via signals.non_package_path on the resolved
      .ko file.

  - site_class: udev
    module: udev
    mitre: [T1546]
    loci:
      - /etc/udev/rules.d/
      - /lib/udev/rules.d/
      - /usr/lib/udev/rules.d/
      - /run/udev/rules.d/
    status: planned
    test_coverage: none
    notes: |
      RUN+= rules in udev are a documented persistence vector. One
      record per file; exec_target populated from RUN+= value.
      Normalization preserves match key order.
