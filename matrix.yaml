# linpersist coverage matrix
#
# Source of truth for MITRE ATT&CK Linux persistence coverage.
# Each entry describes one site_class collected by exactly one module.
#
# status values:
#   planned     -- accepted into the roadmap, not yet implemented
#   wip         -- module exists, golden tests not green
#   implemented -- code complete, golden tests green
#   tested      -- integration tests green on at least two target distros
#
# Adding a new site_class requires: spec discussed, ADR if non-obvious,
# golden tests written first, then implementation. Never the other way
# around.

schema_version: 1
target_release: v0.1.0

site_classes:

  - site_class: cron.d
    module: cron
    mitre: [T1053.003]
    loci:
      - /etc/crontab
      - /etc/cron.d/
    status: implemented
    test_coverage: golden
    notes: |
      System-wide crontabs with explicit USER column. One record per
      non-comment, non-blank line. Variable assignments (MAILTO=,
      PATH=, SHELL=, RANDOM_DELAY=, ...) emitted as their own records
      with signal cron_var_assignment.

  - site_class: cron.user
    module: cron
    mitre: [T1053.003]
    loci:
      - /var/spool/cron/crontabs/
      - /var/spool/cron/
    status: implemented
    test_coverage: golden
    notes: |
      Per-user crontabs without USER column; the user name is the file
      name. /var/spool/cron/crontabs/ on Debian/Ubuntu,
      /var/spool/cron/ on RHEL/CentOS/Amazon Linux. One record per
      non-comment, non-blank line.

  - site_class: cron.periodic
    module: cron
    mitre: [T1053.003]
    loci:
      - /etc/cron.hourly/
      - /etc/cron.daily/
      - /etc/cron.weekly/
      - /etc/cron.monthly/
    status: implemented
    test_coverage: golden
    notes: |
      run-parts drop-in directories. Each executable file is an
      atomic record (granularity = per file, not per line). Symlinks
      are followed for hashing and provenance but locus stays the
      original path.

  - site_class: cron.anacron
    module: cron
    mitre: [T1053.003]
    loci:
      - /etc/anacrontab
    status: implemented
    test_coverage: golden
    notes: |
      Anacrontab format per anacrontab(5):
      "period delay jobid command". One record per non-comment,
      non-blank line. Variable assignments handled identically to
      cron.d. @period shorthands (@monthly, @yearly, @daily) emitted
      verbatim.

  - site_class: systemd.unit
    module: systemd
    mitre: [T1543.002]
    loci:
      - /etc/systemd/system/
      - /usr/lib/systemd/system/
      - /lib/systemd/system/
      - /run/systemd/system/
      - /etc/systemd/user/
      - /usr/lib/systemd/user/
      - /home/*/.config/systemd/user/
      - /root/.config/systemd/user/
    status: implemented
    test_coverage: golden+unit
    notes: |
      Per-file record granularity. Extensions in scope: .service,
      .socket, .path, .mount, .automount, .swap, .target. .slice and
      .scope deliberately out of scope for v0.1.0 (noise from
      session-*.scope, user-*.slice; re-evaluate in v0.2.0). Drop-ins
      at *.d/*.conf emit as independent records with signal
      systemd_dropin. Canonical form joins line continuations, sorts
      sections (Unit -> type -> Install) and keys alphabetically with
      Exec* family exempted from sort, sorts whitespace-separated set
      values (Wants, After, ...) alphabetically, preserves ExecStart
      prefixes verbatim. See ADR-0007.

  - site_class: systemd.timer
    module: systemd
    mitre: [T1053.006]
    loci:
      - /etc/systemd/system/
      - /usr/lib/systemd/system/
      - /lib/systemd/system/
      - /run/systemd/system/
      - /etc/systemd/user/
      - /usr/lib/systemd/user/
      - /home/*/.config/systemd/user/
      - /root/.config/systemd/user/
    status: implemented
    test_coverage: golden+unit
    notes: |
      One record per .timer file. Cross-references the .service it
      activates via explicit Unit= or implicit naming convention
      (foo.timer -> foo.service); the cross-reference is preserved
      verbatim in the canonical form, the backend resolves it. Same
      canonical-form pipeline as systemd.unit (see ADR-0007). User
      timers under /home/*/.config/systemd/user/ collected (linger
      hosts).

  - site_class: sysv.init
    module: sysv
    mitre: [T1037.004]
    loci:
      - /etc/init.d/
      - /etc/rc.d/init.d/
      - /etc/rc.local
      - /etc/rc.d/rc.local
      - /etc/rc0.d/
      - /etc/rc1.d/
      - /etc/rc2.d/
      - /etc/rc3.d/
      - /etc/rc4.d/
      - /etc/rc5.d/
      - /etc/rc6.d/
      - /etc/rcS.d/
      - /etc/rc.d/rc0.d/
      - /etc/rc.d/rc1.d/
      - /etc/rc.d/rc2.d/
      - /etc/rc.d/rc3.d/
      - /etc/rc.d/rc4.d/
      - /etc/rc.d/rc5.d/
      - /etc/rc.d/rc6.d/
    status: implemented
    test_coverage: golden+unit
    notes: |
      Largely legacy but still present on RHEL 7, Amazon Linux 2 and
      embedded systems. init.d/* files emit as records directly.
      rc.local files emit as records too. rc[0-6].d/* symlinks are
      treated like systemd .wants/.requires: internal targets (inside
      init.d/) are skipped to avoid double-counting; external targets
      (e.g. a symlink to /tmp/.cache/x.sh) emit a record with the
      sysv_external_init_symlink signal.

  - site_class: ssh.authkeys
    module: ssh
    mitre: [T1098.004]
    loci:
      - /etc/ssh/authorized_keys
      - /etc/ssh/authorized_keys.d/
      - /root/.ssh/authorized_keys
      - /root/.ssh/authorized_keys2
      - /home/*/.ssh/authorized_keys
      - /home/*/.ssh/authorized_keys2
    status: implemented
    test_coverage: golden
    notes: |
      One record per non-comment, non-blank key line. Normalization
      canonicalizes the option list order (command=, from=, no-pty,
      environment=, permitopen=, ...) and excludes the trailing
      comment from content_norm_sha256. The base64 public-key blob
      is NEVER emitted: only its sha256 lands in exec_target_sha256.
      exec_target carries the keytype (ssh-ed25519, ssh-rsa, ...).
      See ADR-0003 for the blob-handling decision. New signals
      ssh_options_present and ssh_forced_command added to the core
      catalog for this module.

  - site_class: sshd.config
    module: sshd
    mitre: [T1098.004, T1556]
    loci:
      - /etc/ssh/sshd_config
      - /etc/ssh/sshd_config.d/
    status: implemented
    test_coverage: golden
    notes: |
      One record per non-comment, non-blank directive line, plus
      one record per Match line. Match block scoping is encoded
      into content_norm_sha256 by prepending the canonical Match
      line to each directive's canonical form (see ADR-0004).
      Directive keywords are lower-cased; values preserved verbatim.
      Three module-specific signals added to core:
      sshd_permit_root_login_yes, sshd_authorized_keys_command,
      sshd_match_block_directive. Lives in its own module (sshd)
      separate from ssh.authkeys because the parsing logic and
      site_class are independent.

  - site_class: pam
    module: pam
    mitre: [T1556.003]
    loci:
      - /etc/pam.d/
      - /etc/pam.conf
    status: implemented
    test_coverage: golden
    notes: |
      One record per non-comment, non-blank line across every file
      under /etc/pam.d/, plus /etc/pam.conf if present. Per-line
      granularity. Line format per pam(7):
      "<type> <control> <module-path> [args...]". exec_target is
      the resolved module-path; standard core signals
      (exec_target_orphan, interpreter_in_tmp,
      recent_target_mtime_7d) cover the textbook implant pattern of
      dropping a .so under /tmp and referencing it from /etc/pam.d/.
      No pam-specific signals added in v0.1.0.

  - site_class: ldso.preload
    module: ldso
    mitre: [T1574.006]
    loci:
      - /etc/ld.so.preload
    status: implemented
    test_coverage: golden
    notes: |
      ld.so.preload is one of the cheapest, highest-signal persistence
      sites. Every non-empty line is a separate record with signals
      including ld_preload_set and exec_target_orphan. Lines containing
      multiple whitespace-separated paths are split: glibc honors that
      form even though ld.so(8) documents one path per line.

  - site_class: ldso.conf
    module: ldso
    mitre: [T1574.006]
    loci:
      - /etc/ld.so.conf
    status: implemented
    test_coverage: golden
    notes: |
      Library search-path configuration. One record per non-comment,
      non-blank line. include directives emitted verbatim as their own
      record; the agent does NOT expand the glob inside the record but
      walks /etc/ld.so.conf.d/ separately under ldso.confd.

  - site_class: ldso.confd
    module: ldso
    mitre: [T1574.006]
    loci:
      - /etc/ld.so.conf.d/
    status: implemented
    test_coverage: golden
    notes: |
      Drop-in directory for ld.so.conf. One record per non-comment,
      non-blank line across every *.conf file under the directory.

  - site_class: sudoers
    module: sudoers
    mitre: [T1548.003]
    loci:
      - /etc/sudoers
      - /etc/sudoers.d/
    status: implemented
    test_coverage: golden
    notes: |
      One record per non-comment, non-blank line. Five line kinds
      recognized: alias (User_Alias, Runas_Alias, Host_Alias,
      Cmnd_Alias), Defaults, user-spec, #include, #includedir.
      Per-line granularity; multi-user / multi-command user-specs
      are NOT cartesian-expanded in v0.1.0. Members of *_Alias
      records are sorted alphabetically for stacking. Include
      directives emitted verbatim; the walker traverses
      /etc/sudoers.d/* on its own without honoring custom
      #includedir paths. Three module-specific signals added to
      core: sudoers_nopasswd, sudoers_all_commands,
      sudoers_include_directive.

  - site_class: passwd.user
    module: passwd
    mitre: [T1136.001]
    loci:
      - /etc/passwd
    status: implemented
    test_coverage: golden
    notes: |
      One record per user with uid 0 OR shell not in
      {/usr/sbin/nologin, /sbin/nologin, /bin/false, /usr/bin/false}.
      Per-line granularity. Signal passwd_uid_zero fires when uid=0
      and username != "root" (non-root uid-0 account is anomalous).

  - site_class: passwd.shadow
    module: passwd
    mitre: [T1136.001]
    loci:
      - /etc/shadow
    status: implemented
    test_coverage: golden
    notes: |
      One record per shadow line corresponding to a passwd.user entry
      (same filter applied). Password hash NEVER emitted (ADR-0005);
      only password_status enum: set / locked / disabled / empty /
      unknown. Signal passwd_no_password fires when status == empty.

  - site_class: passwd.group
    module: passwd
    mitre: [T1136.001]
    loci:
      - /etc/group
    status: implemented
    test_coverage: golden
    notes: |
      One record per group line. Members are sorted alphabetically
      in the canonical form for stacking. Any change to membership
      (an attacker adding a user to wheel, sudo, docker, etc.)
      surfaces immediately as a singleton.

  - site_class: passwd.gshadow
    module: passwd
    mitre: [T1136.001]
    loci:
      - /etc/gshadow
    status: implemented
    test_coverage: golden
    notes: |
      One record per gshadow line. Group password hash treated under
      the same policy as user password hash (ADR-0005): hash never
      emitted, only password_status enum.

  - site_class: profile.system
    module: profile
    mitre: [T1546.004]
    loci:
      - /etc/profile
      - /etc/profile.d/
      - /etc/bash.bashrc
      - /etc/zsh/zshenv
      - /etc/zsh/zprofile
      - /etc/environment
    status: implemented
    test_coverage: golden
    notes: |
      System-wide shell init. Per-file record granularity (pattern
      from cron.periodic). content_norm_sha256 is computed over a
      normalized form that strips comments (any line starting with
      '#' after left-trim, including shebangs since these files are
      sourced not executed), drops blank lines and trims trailing
      whitespace per line. content_sha256 is over the raw file
      bytes. No module-specific signals; standard core signals
      (recent_mtime_*, world_writable, non_root_owner) apply.

  - site_class: profile.user
    module: profile
    mitre: [T1546.004]
    loci:
      - /root/.bashrc
      - /root/.bash_profile
      - /root/.bash_login
      - /root/.profile
      - /root/.zshrc
      - /root/.zshenv
      - /home/*/.bashrc
      - /home/*/.bash_profile
      - /home/*/.bash_login
      - /home/*/.profile
      - /home/*/.zshrc
      - /home/*/.zshenv
    status: implemented
    test_coverage: golden
    notes: |
      Per-user shell init. Same canonicalization rules as
      profile.system. Walker enumerates /root/ and /home/*/ and
      probes each file in the candidate set; missing files produce
      no record. Order across files within a host is NOT recorded
      -- each file is independent for LFA purposes.

  - site_class: motd
    module: motd
    mitre: [T1037]
    loci:
      - /etc/motd
      - /etc/motd.d/
      - /etc/update-motd.d/
    status: implemented
    test_coverage: golden+unit
    notes: |
      MITRE ATT&CK does not (as of May 2026) carry a sub-technique
      specific to motd-via-PAM. T1037 is used as the closest match
      (Boot or Logon Initialization Scripts, parent technique).
      Per-file granularity. Two canonical-form rules per locus:
      plain text for /etc/motd and /etc/motd.d/* ('#' is content,
      not a comment); shell for /etc/update-motd.d/* (strip '#'
      comments + blank lines + trailing whitespace, same as profile
      and sysv). exec_target is set only on update-motd.d/* records
      (those scripts are invoked by pam_motd at login). /etc/issue
      and /etc/issue.net are deliberately out of scope -- they are
      pre-login banners, not a PAM-mediated persistence vector.

  - site_class: kmod
    module: kmod
    mitre: [T1547.006]
    loci:
      - /etc/modules
      - /etc/modules-load.d/
      - /usr/lib/modules-load.d/
      - /run/modules-load.d/
      - /etc/modprobe.d/
      - /lib/modprobe.d/
      - /usr/lib/modprobe.d/
      - /run/modprobe.d/
    status: implemented
    test_coverage: golden+unit
    notes: |
      Per-directive (per-line) granularity. /etc/modules and
      modules-load.d/* are simple lists of module names (one per
      line). modprobe.d/* uses the modprobe(5) directive grammar:
      alias, blacklist, install, options, remove, softdep. Line
      continuations (`\` at EOL) are joined before parsing.
      Canonical form lowercases the first whitespace token and
      collapses runs of internal whitespace to a single space; values
      keep their source case. install directives fire
      kmod_install_directive and populate exec_target with argv[0] of
      the replacement command -- the textbook modprobe.d persistence
      vector. blacklist directives fire kmod_blacklist_directive.

  - site_class: udev
    module: udev
    mitre: [T1546]
    loci:
      - /etc/udev/rules.d/
      - /lib/udev/rules.d/
      - /usr/lib/udev/rules.d/
      - /run/udev/rules.d/
    status: implemented
    test_coverage: golden+unit
    notes: |
      Per-rule (per-logical-line) granularity. Backslash line
      continuations are joined before parsing. Canonical form
      collapses whitespace OUTSIDE quoted values to a single space
      and standardizes spacing around commas to ", "; whitespace
      INSIDE "..." quoted values is preserved verbatim. Key-op-value
      triples retain source order. exec_target is the first token of
      the first RUN+=/RUN= value found in the rule. RUN+= fires
      udev_run_directive; PROGRAM= fires udev_program_directive.
      MITRE T1546 (parent: Event Triggered Execution) -- ATT&CK has
      no Linux-udev sub-technique as of May 2026.
