<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" role="img" aria-label="linpersist query architecture: 10 expert queries with two implementations">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- ───────────── Top: the 10 expert queries ───────────── -->
  <rect x="120" y="20" width="640" height="140" rx="8" stroke="currentColor" fill="none" stroke-width="2"/>
  <text x="440" y="42" fill="currentColor" font-size="13" font-weight="700" text-anchor="middle">
    10 expert threat-hunting queries (Q1 – Q10)
  </text>
  <text x="440" y="58" fill="currentColor" font-size="10.5" text-anchor="middle" opacity="0.75" font-style="italic">
    curated, non-redundant · the same logic compiled into two implementations
  </text>

  <g fill="currentColor" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="140" y="84">Q1  · LFA singletons</text>
    <text x="140" y="102">Q2  · Per-locus singletons</text>
    <text x="140" y="120">Q3  · Peer-group by os_id</text>
    <text x="140" y="138">Q4  · Implant fingerprint</text>
    <text x="380" y="84">Q5  · Signal distribution</text>
    <text x="380" y="102">Q6  · Worm pattern (exec_target)</text>
    <text x="380" y="120">Q7  · Implant roll-call</text>
    <text x="380" y="138">Q8  · Recent-mtime spikes</text>
    <text x="620" y="84">Q9  · Exec in tmp dirs</text>
    <text x="620" y="102">Q10 · Per-host coverage</text>
  </g>

  <!-- splitting arrows -->
  <g stroke="currentColor" fill="none" stroke-width="1.4" marker-end="url(#arrow)">
    <path d="M440,160 L240,205"/>
    <path d="M440,160 L640,205"/>
  </g>
  <text x="440" y="195" fill="currentColor" font-size="10" text-anchor="middle" opacity="0.7" font-style="italic">
    kept in sync, row-for-row
  </text>

  <!-- ───────────── Left: SQL implementation ───────────── -->
  <rect x="60" y="215" width="360" height="115" rx="6" stroke="currentColor" fill="none" stroke-width="2"/>
  <text x="240" y="238" fill="currentColor" font-size="13" font-weight="700" text-anchor="middle">SQL (DuckDB)</text>
  <g fill="currentColor" font-size="11">
    <text x="78" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">tools/stack_demo.sql</text>
    <text x="78" y="282">10 queries separated by</text>
    <text x="78" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">--- query separator ---</text>
    <text x="78" y="318">run via: <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">tools/ingest.sh -q FILE</tspan></text>
  </g>

  <!-- Right: Go implementation -->
  <rect x="460" y="215" width="360" height="115" rx="6" stroke="currentColor" fill="none" stroke-width="2"/>
  <text x="640" y="238" fill="currentColor" font-size="13" font-weight="700" text-anchor="middle">Go (pure, no DB)</text>
  <g fill="currentColor" font-size="11">
    <text x="478" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">cmd/linpersist-report/stats.go</text>
    <text x="478" y="282">10 compute* functions over</text>
    <text x="478" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">[]core.Record</text>
    <text x="478" y="318">run via: <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">./linpersist-report</tspan></text>
  </g>

  <!-- arrows down to runners -->
  <g stroke="currentColor" fill="none" stroke-width="1.4" marker-end="url(#arrow)">
    <path d="M240,330 L240,378"/>
    <path d="M640,330 L640,378"/>
  </g>

  <!-- ───────────── Bottom: runners ───────────── -->
  <rect x="60" y="380" width="360" height="78" rx="6" stroke="currentColor" fill="none" stroke-width="1.6" stroke-dasharray="5,3"/>
  <g fill="currentColor" text-anchor="middle">
    <text x="240" y="403" font-weight="700" font-size="12">DuckDB shell · tools/ingest.sh</text>
    <text x="240" y="422" font-size="10.5">defaults to stack_demo.sql · swap with</text>
    <text x="240" y="437" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">-q my-queries.sql</text>
    <text x="240" y="452" font-size="10" opacity="0.7" font-style="italic">bring your own SQL</text>
  </g>

  <rect x="460" y="380" width="360" height="78" rx="6" stroke="currentColor" fill="none" stroke-width="1.6" stroke-dasharray="5,3"/>
  <g fill="currentColor" text-anchor="middle">
    <text x="640" y="403" font-weight="700" font-size="12">linpersist-report binary</text>
    <text x="640" y="422" font-size="10.5">queries fixed in-binary · output:</text>
    <text x="640" y="437" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">-format html | text</text>
    <text x="640" y="452" font-size="10" opacity="0.7" font-style="italic">no external dependencies</text>
  </g>
</svg>
