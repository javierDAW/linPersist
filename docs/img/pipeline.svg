<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <title>linpersist data pipeline</title>
  <desc>Hosts running linpersist emit NDJSON that is consumed by linpersist-report or DuckDB stacking. detgen is a maintainer-side release gate.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <marker id="arrow-mut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect width="1080" height="600" fill="#ffffff"/>

  <text x="540" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">linpersist pipeline &#8212; host to verdict</text>

  <!-- Column 1: Hosts -->
  <text x="120" y="70" text-anchor="middle" font-size="12" fill="#475569" font-weight="600">1. COLLECT (per host, read-only)</text>

  <g transform="translate(40,90)">
    <rect width="160" height="62" rx="6" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
    <text x="80" y="22" text-anchor="middle" font-weight="600" fill="#0f172a">host-001</text>
    <rect x="14" y="32" width="132" height="22" rx="3" fill="#1f2937"/>
    <text x="80" y="48" text-anchor="middle" fill="#f1f5f9" font-size="11">$ linpersist</text>
  </g>

  <g transform="translate(40,170)">
    <rect width="160" height="62" rx="6" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
    <text x="80" y="22" text-anchor="middle" font-weight="600" fill="#0f172a">host-002</text>
    <rect x="14" y="32" width="132" height="22" rx="3" fill="#1f2937"/>
    <text x="80" y="48" text-anchor="middle" fill="#f1f5f9" font-size="11">$ linpersist</text>
  </g>

  <g transform="translate(40,250)">
    <rect width="160" height="62" rx="6" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="80" y="22" text-anchor="middle" fill="#0f172a">...</text>
    <text x="80" y="44" text-anchor="middle" font-size="11" fill="#475569">(N hosts)</text>
  </g>

  <g transform="translate(40,330)">
    <rect width="160" height="62" rx="6" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
    <text x="80" y="22" text-anchor="middle" font-weight="600" fill="#0f172a">host-N</text>
    <rect x="14" y="32" width="132" height="22" rx="3" fill="#1f2937"/>
    <text x="80" y="48" text-anchor="middle" fill="#f1f5f9" font-size="11">$ linpersist</text>
  </g>

  <!-- Binary callout under hosts -->
  <g transform="translate(40,420)">
    <rect width="160" height="76" rx="6" fill="#fef9c3" stroke="#a16207" stroke-width="1"/>
    <text x="80" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#713f12">binary</text>
    <text x="80" y="38" text-anchor="middle" font-size="11" fill="#713f12">~10 MB static</text>
    <text x="80" y="54" text-anchor="middle" font-size="11" fill="#713f12">CGO_ENABLED=0</text>
    <text x="80" y="70" text-anchor="middle" font-size="10" fill="#713f12">amd64 / arm64 / 386 / arm</text>
  </g>

  <!-- Arrows from hosts to NDJSON -->
  <path d="M 200 121 Q 280 121 350 230" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 200 201 Q 280 201 350 240" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 200 281 Q 280 281 350 260" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 200 361 Q 280 361 350 280" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Column 2: NDJSON -->
  <text x="430" y="70" text-anchor="middle" font-size="12" fill="#475569" font-weight="600">2. CORPUS</text>

  <g transform="translate(350,170)">
    <rect width="160" height="180" rx="6" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
    <text x="80" y="24" text-anchor="middle" font-weight="600" fill="#164e63">corpus/*.ndjson</text>
    <line x1="14" y1="36" x2="146" y2="36" stroke="#0e7490" stroke-width="0.6"/>
    <text x="14" y="56" font-size="10" fill="#0f172a">host-001.ndjson</text>
    <text x="14" y="74" font-size="10" fill="#0f172a">host-002.ndjson</text>
    <text x="14" y="92" font-size="10" fill="#0f172a">host-003.ndjson</text>
    <text x="14" y="110" font-size="10" fill="#94a3b8">...</text>
    <text x="14" y="128" font-size="10" fill="#0f172a">host-N.ndjson</text>
    <line x1="14" y1="138" x2="146" y2="138" stroke="#0e7490" stroke-width="0.6"/>
    <text x="80" y="156" text-anchor="middle" font-size="10" fill="#475569">schema_v: 1</text>
    <text x="80" y="170" text-anchor="middle" font-size="10" fill="#475569">one row per artifact</text>
  </g>

  <!-- Arrow from corpus to consumers -->
  <path d="M 510 200 L 600 130" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 510 260 L 600 260" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 510 320 L 600 390" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Column 3: Consumers -->
  <text x="780" y="70" text-anchor="middle" font-size="12" fill="#475569" font-weight="600">3. ANALYZE</text>

  <!-- Fleet HTML -->
  <g transform="translate(600,90)">
    <rect width="220" height="80" rx="6" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
    <text x="110" y="22" text-anchor="middle" font-weight="700" fill="#1e1b4b">Fleet report</text>
    <text x="110" y="40" text-anchor="middle" font-size="10" fill="#1e1b4b" font-family="ui-monospace,monospace">linpersist-report -i corpus/ -o report.html</text>
    <text x="110" y="58" text-anchor="middle" font-size="10" fill="#475569">Q1&#8211;Q12 stacked across N hosts</text>
    <text x="110" y="72" text-anchor="middle" font-size="10" fill="#475569">HTML or text</text>
  </g>

  <!-- Host dossier HTML -->
  <g transform="translate(600,220)">
    <rect width="220" height="80" rx="6" fill="#fdf4ff" stroke="#a21caf" stroke-width="1.5"/>
    <text x="110" y="22" text-anchor="middle" font-weight="700" fill="#581c87">Host dossier</text>
    <text x="110" y="40" text-anchor="middle" font-size="11" fill="#581c87" font-family="ui-monospace,monospace">linpersist-report --host &lt;id&gt;</text>
    <text x="110" y="58" text-anchor="middle" font-size="10" fill="#475569">Drill-down on a single host</text>
    <text x="110" y="72" text-anchor="middle" font-size="10" fill="#475569">No aggregation queries</text>
  </g>

  <!-- DuckDB -->
  <g transform="translate(600,350)">
    <rect width="220" height="80" rx="6" fill="#ecfccb" stroke="#4d7c0f" stroke-width="1.5"/>
    <text x="110" y="22" text-anchor="middle" font-weight="700" fill="#1a2e05">DuckDB stacking</text>
    <text x="110" y="40" text-anchor="middle" font-size="11" fill="#1a2e05" font-family="ui-monospace,monospace">duckdb &lt; stack_demo.sql</text>
    <text x="110" y="58" text-anchor="middle" font-size="10" fill="#475569">SQL is the source of truth</text>
    <text x="110" y="72" text-anchor="middle" font-size="10" fill="#475569">Recommended fleet &gt; 10k hosts</text>
  </g>

  <!-- Q7 hit indicator / verdict surface -->
  <g transform="translate(860,90)">
    <rect width="180" height="210" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
    <text x="90" y="22" text-anchor="middle" font-weight="700" fill="#7c2d12">verdict surface</text>
    <line x1="14" y1="32" x2="166" y2="32" stroke="#c2410c" stroke-width="0.6"/>
    <text x="14" y="50" font-size="11" fill="#0f172a">Q7 detection hits</text>
    <rect x="14" y="58" width="46" height="16" rx="8" fill="#dc2626"/>
    <text x="37" y="70" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">critical</text>
    <rect x="64" y="58" width="36" height="16" rx="8" fill="#ea580c"/>
    <text x="82" y="70" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">high</text>
    <rect x="104" y="58" width="46" height="16" rx="8" fill="#ca8a04"/>
    <text x="127" y="70" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">medium</text>
    <text x="14" y="100" font-size="11" fill="#0f172a">+ Q1&#8211;Q6, Q8&#8211;Q11</text>
    <text x="14" y="116" font-size="10" fill="#475569">frequency stacks,</text>
    <text x="14" y="130" font-size="10" fill="#475569">LFA, temporal bursts,</text>
    <text x="14" y="144" font-size="10" fill="#475569">orphans, peer groups</text>
    <line x1="14" y1="158" x2="166" y2="158" stroke="#c2410c" stroke-width="0.6"/>
    <text x="14" y="176" font-size="11" font-weight="600" fill="#7c2d12">analyst decides</text>
    <text x="14" y="192" font-size="10" fill="#475569">agent never scores</text>
  </g>

  <!-- Arrows from consumers to verdict surface -->
  <path d="M 820 130 L 860 145" fill="none" stroke="#9ca3af" stroke-width="1" marker-end="url(#arrow-mut)" stroke-dasharray="3 2"/>
  <path d="M 820 260 L 860 190" fill="none" stroke="#9ca3af" stroke-width="1" marker-end="url(#arrow-mut)" stroke-dasharray="3 2"/>
  <path d="M 820 390 L 860 230" fill="none" stroke="#9ca3af" stroke-width="1" marker-end="url(#arrow-mut)" stroke-dasharray="3 2"/>

  <!-- detgen sidebar (bottom band, full width, no overlap with DuckDB) -->
  <g transform="translate(40,520)">
    <rect width="1000" height="64" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1" stroke-dasharray="5 3"/>
    <text x="14" y="22" font-weight="700" fill="#0f172a">detgen</text>
    <text x="74" y="22" font-size="11" fill="#475569">maintainer-side, not part of the runtime pipeline</text>
    <text x="14" y="40" font-size="11" fill="#0f172a" font-family="ui-monospace,monospace">$ go run ./cmd/detgen -in internal/detections/detections.yaml</text>
    <text x="500" y="40" font-size="11" fill="#475569">regenerates Q7 in tools/stack_demo.sql from detections.yaml</text>
    <text x="14" y="56" font-size="11" fill="#475569">enforced as release gate: make detgen-verify</text>
  </g>
</svg>
