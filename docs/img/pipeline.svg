<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" role="img" aria-label="linpersist end-to-end pipeline">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- ───────────── Stage labels (top) ───────────── -->
  <g fill="currentColor" font-size="11" font-weight="600" text-anchor="middle" opacity="0.85">
    <text x="75"  y="22">1 · Collection</text>
    <text x="275" y="22">2 · Agent</text>
    <text x="465" y="22">3 · Aggregation</text>
    <text x="735" y="22">4 · Analysis</text>
  </g>

  <!-- ───────────── Stage 1 · hosts ───────────── -->
  <g stroke="currentColor" fill="none" stroke-width="1.4">
    <rect x="20"  y="46"  width="110" height="36" rx="4"/>
    <rect x="20"  y="94"  width="110" height="36" rx="4"/>
    <rect x="20"  y="142" width="110" height="36" rx="4"/>
    <rect x="20"  y="190" width="110" height="36" rx="4"/>
    <rect x="20"  y="238" width="110" height="36" rx="4"/>
  </g>
  <g fill="currentColor" font-size="12" text-anchor="middle">
    <text x="75" y="69">host-1</text>
    <text x="75" y="117">host-2</text>
    <text x="75" y="165">host-3</text>
    <text x="75" y="213">host-4</text>
    <text x="75" y="261">… × N</text>
  </g>

  <!-- arrows: hosts → linpersist -->
  <g stroke="currentColor" fill="none" stroke-width="1.3" marker-end="url(#arrow)" opacity="0.7">
    <path d="M130,64  L215,140"/>
    <path d="M130,112 L215,150"/>
    <path d="M130,160 L215,160"/>
    <path d="M130,208 L215,170"/>
    <path d="M130,256 L215,180"/>
  </g>

  <!-- ───────────── Stage 2 · linpersist agent ───────────── -->
  <rect x="215" y="110" width="155" height="100" rx="6" stroke="currentColor" fill="none" stroke-width="2"/>
  <g fill="currentColor" text-anchor="middle">
    <text x="292.5" y="135" font-weight="700" font-size="14">linpersist</text>
    <text x="292.5" y="155" font-size="11">read-only collector</text>
    <text x="292.5" y="174" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">~10 MB · CGO=0</text>
    <text x="292.5" y="190" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">stdout · --output</text>
    <text x="292.5" y="205" font-size="10">deploy once per host</text>
  </g>

  <!-- arrow agent → fleet -->
  <g stroke="currentColor" fill="none" stroke-width="1.4" marker-end="url(#arrow)">
    <path d="M370,160 L460,160"/>
  </g>
  <text x="415" y="150" fill="currentColor" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">NDJSON</text>

  <!-- ───────────── Stage 3 · fleet aggregate ───────────── -->
  <rect x="460" y="110" width="135" height="100" rx="6" stroke="currentColor" fill="none" stroke-width="1.6" stroke-dasharray="6,3"/>
  <g fill="currentColor" text-anchor="middle">
    <text x="527.5" y="138" font-weight="700" font-size="13">fleet/</text>
    <text x="527.5" y="158" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">*.ndjson</text>
    <text x="527.5" y="178" font-size="10.5">one file</text>
    <text x="527.5" y="192" font-size="10.5">per host</text>
  </g>

  <!-- arrows: fleet → two paths -->
  <g stroke="currentColor" fill="none" stroke-width="1.4" marker-end="url(#arrow)">
    <path d="M595,135 L635,75"/>
    <path d="M595,185 L635,245"/>
  </g>

  <!-- ───────────── Stage 4 · two analysis paths ───────────── -->

  <!-- Path A: linpersist-report (top) -->
  <rect x="635" y="45" width="225" height="68" rx="6" stroke="currentColor" fill="none" stroke-width="2"/>
  <g fill="currentColor" text-anchor="middle">
    <text x="747.5" y="66" font-weight="700" font-size="13">Path A · linpersist-report</text>
    <text x="747.5" y="84" font-size="11">Go-native, 10 expert queries</text>
    <text x="747.5" y="101" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">→ report.html · report.txt</text>
  </g>

  <!-- Path B: DuckDB (bottom) -->
  <rect x="635" y="215" width="225" height="68" rx="6" stroke="currentColor" fill="none" stroke-width="2"/>
  <g fill="currentColor" text-anchor="middle">
    <text x="747.5" y="236" font-weight="700" font-size="13">Path B · DuckDB cookbook</text>
    <text x="747.5" y="254" font-size="11">columnar SQL · scales past 10k</text>
    <text x="747.5" y="271" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">→ ad-hoc queries · Parquet</text>
  </g>

  <!-- ───────────── Footer notes ───────────── -->
  <g fill="currentColor" font-size="11" text-anchor="middle" opacity="0.7">
    <text x="747.5" y="130" font-style="italic">single static binary, no DB needed</text>
    <text x="747.5" y="305" font-style="italic">power users · large fleets · ad-hoc</text>
  </g>

  <!-- guideline -->
  <line x1="20" y1="320" x2="860" y2="320" stroke="currentColor" stroke-width="0.5" opacity="0.3"/>
  <text x="440" y="340" fill="currentColor" font-size="10.5" text-anchor="middle" opacity="0.75">
    the agent collects · the backend decides · zero classification on the host
  </text>
</svg>
