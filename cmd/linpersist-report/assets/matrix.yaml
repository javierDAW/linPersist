      trailing whitespace; quotes around values are preserved
      verbatim (they affect grub-mkconfig parsing). MITRE T1542.003
      (Pre-OS Boot: Bootkit) -- closest match in ATT&CK for
      cmdline-injection without a real bootloader implant.

